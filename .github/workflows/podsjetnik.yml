name: Podsjetnici za rezervacije
on:
  schedule:
    - cron: '7 * * * *'   # svakih sat vremena
  workflow_dispatch: {}
jobs:
  podsjetnik:
    runs-on: ubuntu-latest
    steps:
      - name: Pozovi podsjetnike
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -fsS -X POST https://www.skripta.ba/api/podsjetnik -H "x-cron-secret: $CRON_SECRET"
