name: Podsjetnici za rezervacije
on:
  schedule:
    - cron: '7 * * * *'   # svakih sat vremena
  workflow_dispatch: {}
jobs:
  podsjetnik:
    runs-on: ubuntu-latest
    steps:
      - name: Pozovi podsjetnike
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          echo "GitHub secret length: ${#CRON_SECRET}"
          curl -sS -w "\nHTTP %{http_code}\n" -X POST https://skripta-1k7.pages.dev/api/podsjetnik -H "x-cron-secret: $CRON_SECRET" | tee out.txt
          grep -q "HTTP 200" out.txt
